<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shadaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="shadaAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card Effect for Standalone Preview -->
  <rect width="500" height="120" rx="16" fill="#0D0F12" />

  <!-- Monogram Icon Symbol -->
  <g transform="translate(25, 20)">
    <!-- Hexagonal Diamond Frame -->
    <polygon points="40,5 75,25 75,65 40,85 5,65 5,25" fill="none" stroke="url(#shadaGold)" stroke-width="3" opacity="0.9"/>
    <polygon points="40,12 68,28 68,62 40,78 12,62 12,28" fill="none" stroke="url(#shadaAccent)" stroke-width="1" opacity="0.4"/>
    
    <!-- Styled S & 1 Monogram -->
    <path d="M 46 26 C 30 24 24 35 38 43 C 54 50 48 64 30 62" fill="none" stroke="url(#shadaGold)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Numeric 1 Stroke accent -->
    <path d="M 48 24 L 54 20 L 54 66" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="46" y1="66" x2="60" y2="66" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(120, 48)">
    <!-- SHADA Text -->
    <text x="0" y="24" font-family="'Syne', 'Playfair Display', 'Cinzel', 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="5" fill="#FFFFFF">SHADA</text>
    <!-- 1st Badge Text -->
    <text x="142" y="24" font-family="'Syne', 'Playfair Display', 'Inter', sans-serif" font-size="34" font-weight="900" fill="url(#shadaGold)" filter="url(#glow)">1st</text>
    <!-- Tagline -->
    <text x="2" y="48" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="7" fill="#A0A5B5">APPAREL SHOP</text>
  </g>
</svg>
