<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171F"/>
      <stop offset="100%" stop-color="#0B0C10"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <!-- Decorative Grid Lines -->
  <circle cx="300" cy="300" r="220" fill="none" stroke="#2A2F3D" stroke-width="1" stroke-dasharray="6,6"/>
  <circle cx="300" cy="300" r="160" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.2"/>
  
  <!-- T-Shirt Silhouette -->
  <g transform="translate(150, 120)">
    <path d="M 90 40 Q 150 70 210 40 L 280 90 L 240 160 L 210 145 L 210 340 L 90 340 L 90 145 L 60 160 L 20 90 Z" 
          fill="#1C212C" stroke="url(#goldAccent)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Collar Detail -->
    <path d="M 90 40 Q 150 75 210 40" fill="none" stroke="url(#goldAccent)" stroke-width="3"/>
    <!-- Graphic Front Print -->
    <text x="150" y="210" font-family="'Syne', sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="url(#goldAccent)" letter-spacing="4">SHADA 01</text>
    <text x="150" y="235" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#A0A5B5" letter-spacing="6">LIMITED EDITION</text>
    <line x1="100" y1="255" x2="200" y2="255" stroke="#C59B27" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Tag / Watermark -->
  <rect x="30" y="520" width="160" height="40" rx="8" fill="#1E2330" stroke="#33394B"/>
  <text x="110" y="545" font-family="sans-serif" font-size="12" font-weight="700" fill="#D4AF37" text-anchor="middle">SHADA1st APPAREL</text>
</svg>
